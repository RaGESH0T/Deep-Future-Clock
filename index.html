<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>The Deep Future Clock</title>
<style>
  :root {
    --fg: #ece9e2;
    --dim: rgba(236, 233, 226, 0.55);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #05070d;
    color: var(--fg);
    overscroll-behavior: none;
    scrollbar-width: none;
    -webkit-tap-highlight-color: transparent;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #sky {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0; display: block;
  }
  /* Vignette + very subtle color fringe — the "lens" */
  .veil {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 130% 100% at 50% 55%,
        transparent 30%,
        rgba(0,0,0,.34) 68%,
        rgba(0,0,0,.82) 100%);
  }
  .stage {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding: 8vmin 6vmin 16vmin;
    pointer-events: none; text-align: center;
  }
  .readout {
    width: 100%; max-width: 24ch;
    display: flex; flex-direction: column; align-items: center;
  }
  .number {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    line-height: .92;
    text-shadow: 0 0 70px rgba(0,0,0,.8), 0 2px 14px rgba(0,0,0,.65);
    display: flex; flex-direction: column; align-items: center; gap: .12em;
  }
  #num {
    font-size: clamp(2.6rem, 12.5vw, 9.5rem);
    font-weight: 200;
    letter-spacing: -0.048em;
    white-space: nowrap; display: block;
  }
  #unit {
    font-size: clamp(.68rem, 1.55vw, .98rem);
    font-weight: 400; letter-spacing: 0.34em;
    text-transform: uppercase; color: var(--dim);
    display: block; min-height: 1.2em;
  }
  .rule {
    width: clamp(44px, 8vw, 96px);
    height: 1px; background: currentColor; opacity: .22;
    margin: clamp(1.7rem, 4.2vh, 2.8rem) auto clamp(1.4rem, 3.4vh, 2.2rem);
  }
  .milestones {
    display: grid; place-items: center;
    min-height: 5.6em; width: 100%;
  }
  .line {
    grid-area: 1 / 1; margin: 0;
    max-width: 26ch;
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(1.05rem, 2.5vw, 1.72rem);
    line-height: 1.36;
    color: rgba(236, 233, 226, 0.94);
    opacity: 0; transform: translateY(6px);
    transition: opacity 950ms cubic-bezier(.2,.6,.2,1),
                transform 950ms cubic-bezier(.2,.6,.2,1);
    text-wrap: balance;
    text-shadow: 0 2px 26px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.65);
  }
  .line.active { opacity: 1; transform: translateY(0); }
  .line.leaving { opacity: 0; transform: translateY(-6px); }
  .source {
    margin: clamp(1.1rem, 2.6vh, 1.8rem) 0 0;
    font-size: clamp(.62rem, 1.15vw, .74rem);
    letter-spacing: .24em; text-transform: uppercase;
    color: rgba(236, 233, 226, 0.34);
    opacity: 0; transition: opacity 900ms ease;
  }
  .source.visible { opacity: 1; }
  .hint {
    position: fixed; left: 50%;
    bottom: max(6vh, env(safe-area-inset-bottom, 0px) + 4vh);
    transform: translateX(-50%);
    z-index: 4; font-size: .66rem;
    letter-spacing: .44em; text-transform: uppercase;
    color: var(--dim); transition: opacity 800ms ease;
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 1em;
  }
  .hint.hidden { opacity: 0; }
  .hint .chev {
    width: 1px; height: 28px;
    background: linear-gradient(to bottom, transparent, var(--dim));
  }
  .endnote {
    position: fixed; left: 50%;
    bottom: max(9vh, env(safe-area-inset-bottom, 0px) + 7vh);
    transform: translate(-50%, 10px);
    z-index: 4;
    font-family: var(--serif); font-style: italic;
    font-size: clamp(.98rem, 2vw, 1.3rem);
    color: rgba(236,233,226,.85);
    opacity: 0;
    transition: opacity 1500ms ease, transform 1500ms ease;
    pointer-events: none; text-align: center;
    width: min(90vw, 42ch);
    text-shadow: 0 2px 28px rgba(0,0,0,.9);
  }
  .endnote.visible { opacity: 1; transform: translate(-50%, 0); }
  .rail {
    position: fixed;
    right: clamp(16px, 2.4vw, 32px);
    top: 16vh; height: 68vh; width: 2px; z-index: 5;
    background: linear-gradient(to bottom,
      transparent, rgba(255,255,255,.12) 6%,
      rgba(255,255,255,.12) 94%, transparent);
    pointer-events: auto; cursor: pointer; touch-action: none;
  }
  .rail::before {
    content: ""; position: absolute;
    top: 0; bottom: 0; left: -18px; right: -18px;
  }
  .rail-tick {
    position: absolute; right: -8px;
    width: 18px; height: 18px;
    margin: 0; padding: 0;
    background: none; border: 0; cursor: pointer;
    pointer-events: auto; transform: translateY(-50%);
    display: grid; place-items: center;
  }
  .rail-tick::after {
    content: ""; width: 7px; height: 1px;
    background: rgba(255,255,255,.34);
    transition: width 240ms ease, background 240ms ease;
  }
  .rail-tick:hover::after,
  .rail-tick:focus-visible::after,
  .rail-tick[data-active="true"]::after {
    width: 13px; background: rgba(255,255,255,.95);
  }
  .rail-tick:focus-visible { outline: none; }
  .rail-head {
    position: absolute; right: -5px;
    width: 10px; height: 10px;
    border-radius: 50%; background: var(--fg);
    box-shadow: 0 0 14px rgba(236,233,226,.6), 0 0 3px rgba(236,233,226,.95);
    transform: translateY(-50%); pointer-events: none;
  }
  @media (max-width: 720px) { .rail { display: none; } }
  .controls {
    position: fixed; left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%); z-index: 6;
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; padding: 0 12px; max-width: 100vw;
  }
  .controls button {
    appearance: none;
    background: rgba(15,15,20,.46);
    border: 1px solid rgba(255,255,255,.10);
    color: var(--dim); font: inherit;
    font-size: .64rem; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase;
    padding: .6em 1.05em; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: color 200ms ease, border-color 200ms ease, background 200ms ease;
    white-space: nowrap;
  }
  .controls button:hover {
    color: var(--fg);
    border-color: rgba(255,255,255,.26);
    background: rgba(30,30,40,.6);
  }
  .controls button:focus-visible {
    outline: 1px solid rgba(255,255,255,.55);
    outline-offset: 2px;
  }
  .controls button[aria-pressed="true"] {
    color: rgba(255,255,255,.42);
    border-color: rgba(255,255,255,.06);
    background: rgba(15,15,20,.28);
  }
  .controls button[data-flash="true"] {
    color: #fff;
    border-color: rgba(255,255,255,.55);
  }
  .spacer { height: 1400vh; }
  @media (prefers-reduced-motion: reduce) {
    .line { transition-duration: 240ms; }
    .endnote { transition-duration: 400ms; }
  }
  .sr {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main class="stage">
  <div class="readout">
    <div class="number" id="number">
      <span id="num">Now</span>
      <span id="unit"></span>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div class="milestones">
      <p class="line active" id="lineA">You are here.</p>
      <p class="line" id="lineB" aria-hidden="true"></p>
    </div>
    <p class="source" id="source"></p>
  </div>
</main>

<nav class="rail" id="rail" aria-label="Timeline navigation"></nav>

<div class="controls" role="group" aria-label="Controls">
  <button id="playBtn" type="button" aria-label="Play the journey" aria-pressed="false">Play</button>
  <button id="nowBtn" type="button" aria-label="Return to now">Now</button>
  <button id="randomBtn" type="button" aria-label="Jump to a random future">Random</button>
  <button id="shareBtn" type="button" aria-label="Copy a link to this moment">Share</button>
  <button id="muteBtn" type="button" aria-label="Mute sound" aria-pressed="false">Sound</button>
</div>

<div class="hint" id="hint" aria-hidden="true">
  <span>Scroll</span>
  <span class="chev"></span>
</div>

<div class="endnote" id="endnote">None of this matters. That&rsquo;s okay.</div>

<p id="live" class="sr" aria-live="polite"></p>
<div class="spacer"></div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  Config
  // ============================================================
  const MAX_YEARS = 8_000_000_000;
  const MAX_LOG   = Math.log10(MAX_YEARS);
  const HOLD      = 0.02;
  const REDUCED   = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const MILESTONES = [
    { y: 0,             line: "You are here.",                                     source: "" },
    { y: 50,            line: "The last person who remembers you will likely be gone.", source: "Memory & mortality" },
    { y: 200,           line: "Everyone alive today will be gone.",                source: "Maximum human lifespan" },
    { y: 1_000,         line: "English will be unintelligible to modern ears.",   source: "Historical linguistics" },
    { y: 10_000,        line: "The Sahara will be green again.",                   source: "Milankovitch cycles" },
    { y: 50_000,        line: "Niagara Falls will have eroded away.",              source: "Erosion rates" },
    { y: 100_000,       line: "The night sky will be unrecognizable.",             source: "Stellar proper motion" },
    { y: 1_000_000,     line: "Most of what we built will have vanished.",         source: "Material degradation" },
    { y: 2_000_000,     line: "New species of humans may walk the Earth.",         source: "Speciation timescales" },
    { y: 50_000_000,    line: "The Mediterranean will close.",                     source: "Plate tectonics" },
    { y: 250_000_000,   line: "The continents will merge into Pangaea Ultima.",    source: "Plate tectonics models" },
    { y: 600_000_000,   line: "Total solar eclipses will cease.",                  source: "Lunar recession" },
    { y: 1_000_000_000, line: "The Sun will be 10% brighter. Earth is hotter.",    source: "Stellar evolution" },
    { y: 2_500_000_000, line: "The outer core freezes. The magnetic field fails.", source: "Geodynamo modeling" },
    { y: 5_000_000_000, line: "The Sun exhausts its hydrogen and begins to swell.",source: "Stellar evolution" },
    { y: 7_900_000_000, line: "The Sun swallows the Earth.",                       source: "Red giant expansion" }
  ];

  // ============================================================
  //  Helpers
  // ============================================================
  const scrollToYears = p => p <= HOLD ? 0 : Math.pow(10, ((p - HOLD) / (1 - HOLD)) * MAX_LOG);
  const yearsToScroll = y => y <= 1 ? 0 : HOLD + (Math.log10(y) / MAX_LOG) * (1 - HOLD);
  const depthOf       = y => y <= 1 ? 0 : Math.log10(y) / MAX_LOG;
  const maxScroll     = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  const lerp          = (a, b, t) => a + (b - a) * t;
  const clamp         = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const smooth        = t => t * t * (3 - 2 * t);

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function fmt(y) {
    if (y < 1) return { n: "Now", u: "" };
    if (y < 10) return { n: String(Math.round(y * 10) / 10), u: "years" };
    if (y < 1_000) return { n: String(Math.round(y)), u: "years" };
    if (y < 1_000_000) return { n: Math.round(y).toLocaleString("en-US"), u: "years" };
    const scales = [{ div: 1e9, u: "billion years" }, { div: 1e6, u: "million years" }];
    for (const s of scales) {
      if (y >= s.div) {
        const v = y / s.div;
        const n = v < 100 ? String(Math.round(v * 10) / 10) : String(Math.round(v));
        return { n, u: s.u };
      }
    }
    return { n: String(Math.round(y)), u: "years" };
  }

  // ============================================================
  //  Scenery — a single cinematic still that morphs with depth
  // ============================================================
  const Scenery = (() => {
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d", { alpha: false });
    let W = 0, H = 0, dpr = 1;

    // Star cache (regenerated only on resize)
    let starCanvas = null;
    let starW = 0, starH = 0;

    // Ridges — generated once
    const RIDGE_N = 300;
    let ridgeLayers = [];

    // Galactic band angle
    const BAND = -0.62;

    // ---------------- Keyframes: the "shot list" ----------------
    const KEY = [
      { d: 0.00, // Now — familiar night sky
        skyTop: [  3,   4,  10], skyMid: [  7,  10,  22], skyBot: [ 18,  26,  50],
        haze:   [ 55,  80, 140], hazeA: 0.34,
        stars: 0.90, milky: 0.78,
        ridge: [  5,   7,  12], rough: 1.00, city: 1.00,
        sun: { x: 0.76, y: 0.20, r: 0.012, color: [235, 240, 255], glow: 0.55 }
      },
      { d: 0.10, // ~200 yrs
        skyTop: [  3,   4,  10], skyMid: [  7,  10,  22], skyBot: [ 18,  26,  50],
        haze:   [ 55,  80, 140], hazeA: 0.34,
        stars: 0.94, milky: 0.82,
        ridge: [  5,   7,  12], rough: 1.00, city: 0.00,
        sun: { x: 0.76, y: 0.20, r: 0.012, color: [235, 240, 255], glow: 0.55 }
      },
      { d: 0.22, // ~1000 yrs
        skyTop: [  5,   5,  16], skyMid: [ 10,   8,  26], skyBot: [ 22,  18,  44],
        haze:   [ 60,  55, 110], hazeA: 0.30,
        stars: 0.96, milky: 0.80,
        ridge: [  6,   6,  14], rough: 0.94, city: 0.00,
        sun: { x: 0.74, y: 0.22, r: 0.014, color: [228, 228, 245], glow: 0.60 }
      },
      { d: 0.38, // ~10k yrs — Sahara green again
        skyTop: [  8,  12,  26], skyMid: [ 34,  26,  18], skyBot: [ 68,  46,  24],
        haze:   [130,  85,  40], hazeA: 0.38,
        stars: 0.70, milky: 0.52,
        ridge: [ 16,  14,  14], rough: 0.78, city: 0.00,
        sun: { x: 0.68, y: 0.36, r: 0.024, color: [255, 220, 150], glow: 0.90 }
      },
      { d: 0.55, // ~100k yrs — unfamiliar sky
        skyTop: [ 10,   6,  22], skyMid: [ 18,  10,  32], skyBot: [ 32,  16,  40],
        haze:   [ 75,  45,  90], hazeA: 0.32,
        stars: 1.00, milky: 0.62,
        ridge: [ 10,   6,  16], rough: 0.66, city: 0.00,
        sun: { x: 0.28, y: 0.30, r: 0.018, color: [212, 212, 240], glow: 0.55 }
      },
      { d: 0.70, // ~10M yrs
        skyTop: [ 24,  14,  18], skyMid: [ 38,  22,  22], skyBot: [ 54,  34,  26],
        haze:   [105,  62,  46], hazeA: 0.30,
        stars: 0.68, milky: 0.34,
        ridge: [ 18,  10,  12], rough: 0.56, city: 0.00,
        sun: { x: 0.56, y: 0.28, r: 0.026, color: [240, 210, 180], glow: 0.72 }
      },
      { d: 0.84, // ~250M yrs — Pangaea Ultima
        skyTop: [ 42,  20,  24], skyMid: [ 64,  32,  32], skyBot: [ 88,  46,  38],
        haze:   [150,  75,  62], hazeA: 0.32,
        stars: 0.36, milky: 0.18,
        ridge: [ 28,  15,  16], rough: 0.32, city: 0.00,
        sun: { x: 0.52, y: 0.34, r: 0.040, color: [255, 200, 165], glow: 0.98 }
      },
      { d: 0.93, // ~1B yrs — brighter Sun
        skyTop: [ 62,  32,  18], skyMid: [112,  62,  30], skyBot: [168,  92,  46],
        haze:   [210, 115,  55], hazeA: 0.36,
        stars: 0.12, milky: 0.05,
        ridge: [ 32,  17,  12], rough: 0.28, city: 0.00,
        sun: { x: 0.50, y: 0.36, r: 0.078, color: [255, 220, 170], glow: 1.32 }
      },
      { d: 0.98, // ~5B yrs — red giant
        skyTop: [120,  30,  12], skyMid: [185,  55,  20], skyBot: [225,  95,  42],
        haze:   [255, 135,  72], hazeA: 0.42,
        stars: 0.02, milky: 0.00,
        ridge: [ 38,  18,  14], rough: 0.18, city: 0.00,
        sun: { x: 0.50, y: 0.48, r: 0.30, color: [255, 130, 70], glow: 2.00 }
      },
      { d: 1.00, // 7.9B yrs — engulfed
        skyTop: [255, 235, 210], skyMid: [255, 245, 225], skyBot: [255, 250, 240],
        haze:   [255, 245, 230], hazeA: 0.55,
        stars: 0.00, milky: 0.00,
        ridge: [ 60,  30,  20], rough: 0.10, city: 0.00,
        sun: { x: 0.50, y: 0.50, r: 0.95, color: [255, 250, 240], glow: 2.80 }
      }
    ];

    function frameAt(depth) {
      if (depth <= KEY[0].d) return KEY[0];
      const last = KEY[KEY.length - 1];
      if (depth >= last.d) return last;
      for (let i = 0; i < KEY.length - 1; i++) {
        const a = KEY[i], b = KEY[i + 1];
        if (depth >= a.d && depth <= b.d) {
          const t = smooth((depth - a.d) / (b.d - a.d));
          return {
            skyTop: [lerp(a.skyTop[0],b.skyTop[0],t), lerp(a.skyTop[1],b.skyTop[1],t), lerp(a.skyTop[2],b.skyTop[2],t)],
            skyMid: [lerp(a.skyMid[0],b.skyMid[0],t), lerp(a.skyMid[1],b.skyMid[1],t), lerp(a.skyMid[2],b.skyMid[2],t)],
            skyBot: [lerp(a.skyBot[0],b.skyBot[0],t), lerp(a.skyBot[1],b.skyBot[1],t), lerp(a.skyBot[2],b.skyBot[2],t)],
            haze:   [lerp(a.haze[0],b.haze[0],t),     lerp(a.haze[1],b.haze[1],t),     lerp(a.haze[2],b.haze[2],t)],
            hazeA:  lerp(a.hazeA, b.hazeA, t),
            stars:  lerp(a.stars, b.stars, t),
            milky:  lerp(a.milky, b.milky, t),
            ridge:  [lerp(a.ridge[0],b.ridge[0],t),   lerp(a.ridge[1],b.ridge[1],t),   lerp(a.ridge[2],b.ridge[2],t)],
            rough:  lerp(a.rough, b.rough, t),
            city:   lerp(a.city, b.city, t),
            sun: {
              x: lerp(a.sun.x, b.sun.x, t),
              y: lerp(a.sun.y, b.sun.y, t),
              r: lerp(a.sun.r, b.sun.r, t),
              color: [
                lerp(a.sun.color[0],b.sun.color[0],t),
                lerp(a.sun.color[1],b.sun.color[1],t),
                lerp(a.sun.color[2],b.sun.color[2],t)
              ],
              glow: lerp(a.sun.glow, b.sun.glow, t)
            }
          };
        }
      }
      return KEY[0];
    }

    // ---------------- Ridge generation ----------------
    function buildRidges() {
      ridgeLayers = [
        { seed: 301, amp: 0.035, base: 0.76, hazeMix: 0.72 },
        { seed: 302, amp: 0.062, base: 0.82, hazeMix: 0.42 },
        { seed: 303, amp: 0.098, base: 0.89, hazeMix: 0.10 }
      ];
      for (const L of ridgeLayers) {
        const rng = mulberry32(L.seed);
        const octaves = [
          { f: 0.8,  a: 1.00, ph: rng() * 6.283 },
          { f: 1.7,  a: 0.50, ph: rng() * 6.283 },
          { f: 3.3,  a: 0.26, ph: rng() * 6.283 },
          { f: 6.9,  a: 0.13, ph: rng() * 6.283 },
          { f: 14.3, a: 0.06, ph: rng() * 6.283 },
          { f: 28.7, a: 0.03, ph: rng() * 6.283 }
        ];
        const arr = new Float32Array(RIDGE_N);
        for (let i = 0; i < RIDGE_N; i++) {
          const x = i / (RIDGE_N - 1);
          let v = 0;
          for (const o of octaves) v += Math.sin(x * o.f * 6.283 + o.ph) * o.a;
          v /= 2.0;                             // roughly -1..1
          arr[i] = clamp(0.5 + v * 0.5, 0, 1);  // 0..1
        }
        L.arr = arr;
      }
    }

    // ---------------- Star cache ----------------
    // Realistic distribution: many dim, few bright. Bright stars get
    // 4-point diffraction spikes — the signature of a real photograph.
    function buildStarCache() {
      starCanvas = document.createElement("canvas");
      starCanvas.width = starW;
      starCanvas.height = starH;
      const c = starCanvas.getContext("2d");
      c.scale(dpr, dpr);

      const rng = mulberry32(0xC0FFEE);
      const dx = Math.cos(BAND), dy = Math.sin(BAND);
      const nx = -dy, ny = dx;

      const TOTAL = Math.min(11000, Math.max(3500, Math.round((W * H) / 320)));

      // Deep dim field
      for (let i = 0; i < TOTAL; i++) {
        // 55% clustered in the galactic band
        let x, y;
        if (rng() < 0.55) {
          const t = rng();
          // gaussian-ish perpendicular offset
          const g = (rng() + rng() + rng() + rng() - 2) * 0.5;
          const off = g * 0.16;
          x = 0.5 + (t - 0.5) * 1.7 * dx + off * nx + (rng() - 0.5) * 0.04;
          y = 0.5 + (t - 0.5) * 1.7 * dy + off * ny + (rng() - 0.5) * 0.04;
        } else {
          x = rng() * 1.5 - 0.25;
          y = rng() * 1.5 - 0.25;
        }
        if (x < -0.05 || x > 1.05 || y < -0.05 || y > 1.05) continue;

        const px = x * W, py = y * H;

        // magnitude: power law, so most stars are very faint
        const mag = Math.pow(rng(), 4.5);

        // color temperature: mostly white, some blue, some orange
        const ct = rng();
        let cr, cg, cb;
        if (ct < 0.72)      { cr = 235; cg = 238; cb = 250; }
        else if (ct < 0.90) { cr = 200; cg = 218; cb = 255; }
        else                { cr = 255; cg = 220; cb = 180; }

        const r = 0.15 + mag * 2.4;
        const a = 0.14 + mag * 0.85;

        // Glow for the brightest few
        if (mag > 0.78) {
          const gr = r * 8;
          const glow = c.createRadialGradient(px, py, 0, px, py, gr);
          glow.addColorStop(0, `rgba(${cr},${cg},${cb},${a * 0.5})`);
          glow.addColorStop(0.35, `rgba(${cr},${cg},${cb},${a * 0.10})`);
          glow.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          c.fillStyle = glow;
          c.beginPath();
          c.arc(px, py, gr, 0, 6.283);
          c.fill();
        }

        c.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        c.beginPath();
        c.arc(px, py, r, 0, 6.283);
        c.fill();

        // Diffraction spikes — the "photograph" signature
        if (mag > 0.86) {
          const len = 3 + mag * 22;
          // horizontal
          const hg = c.createLinearGradient(px - len, py, px + len, py);
          hg.addColorStop(0,   `rgba(${cr},${cg},${cb},0)`);
          hg.addColorStop(0.5, `rgba(${cr},${cg},${cb},${a * 0.55})`);
          hg.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
          c.strokeStyle = hg;
          c.lineWidth = 0.55;
          c.beginPath();
          c.moveTo(px - len, py); c.lineTo(px + len, py);
          c.stroke();
          // vertical
          const vg = c.createLinearGradient(px, py - len, px, py + len);
          vg.addColorStop(0,   `rgba(${cr},${cg},${cb},0)`);
          vg.addColorStop(0.5, `rgba(${cr},${cg},${cb},${a * 0.55})`);
          vg.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
          c.strokeStyle = vg;
          c.beginPath();
          c.moveTo(px, py - len); c.lineTo(px, py + len);
          c.stroke();
        }
      }
    }

    // ---------------- Resize ----------------
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width  = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      starW = canvas.width;
      starH = canvas.height;

      if (!ridgeLayers.length) buildRidges();
      buildStarCache();
    }

    // ---------------- Sky ----------------
    function drawSky(f) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0.00, `rgb(${f.skyTop[0]|0},${f.skyTop[1]|0},${f.skyTop[2]|0})`);
      g.addColorStop(0.55, `rgb(${f.skyMid[0]|0},${f.skyMid[1]|0},${f.skyMid[2]|0})`);
      g.addColorStop(1.00, `rgb(${f.skyBot[0]|0},${f.skyBot[1]|0},${f.skyBot[2]|0})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Faint nebula washes — 4 soft blobs
      const washes = [
        { x: 0.22, y: 0.28, r: 0.75, c: [ 55,  70, 130], a: 0.12 },
        { x: 0.80, y: 0.34, r: 0.60, c: [140,  60, 120], a: 0.08 },
        { x: 0.50, y: 0.70, r: 0.80, c: [ 50,  80, 120], a: 0.07 },
        { x: 0.12, y: 0.66, r: 0.55, c: [160,  80,  70], a: 0.05 }
      ];
      for (const w of washes) {
        const gx = w.x * W, gy = w.y * H, gr = w.r * Math.min(W, H);
        const wg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
        wg.addColorStop(0, `rgba(${w.c[0]},${w.c[1]},${w.c[2]},${w.a})`);
        wg.addColorStop(0.5, `rgba(${w.c[0]},${w.c[1]},${w.c[2]},${w.a * 0.28})`);
        wg.addColorStop(1, `rgba(${w.c[0]},${w.c[1]},${w.c[2]},0)`);
        ctx.fillStyle = wg;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ---------------- Milky Way ----------------
    function drawMilky(f) {
      if (f.milky < 0.01) return;
      const cx = W * 0.5, cy = H * 0.5;
      const bw = Math.min(W, H) * 0.55;
      const bl = Math.max(W, H) * 2.6;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(BAND);
      const g = ctx.createLinearGradient(0, -bw, 0, bw);
      g.addColorStop(0.00, "rgba(120,140,200,0)");
      g.addColorStop(0.34, "rgba(140,160,215,0.05)");
      g.addColorStop(0.46, "rgba(190,205,245,0.16)");
      g.addColorStop(0.50, "rgba(210,225,255,0.22)");
      g.addColorStop(0.54, "rgba(190,205,245,0.16)");
      g.addColorStop(0.66, "rgba(140,160,215,0.05)");
      g.addColorStop(1.00, "rgba(120,140,200,0)");
      ctx.globalAlpha = f.milky;
      ctx.fillStyle = g;
      ctx.fillRect(-bl, -bw, bl * 2, bw * 2);

      // Dust lanes — long, dark, aligned to the band
      const rng = mulberry32(0xDEAD);
      for (let i = 0; i < 12; i++) {
        const t = rng();
        const offY = (rng() - 0.5) * bw * 0.55;
        const w = 300 + rng() * 700;
        const h = 12 + rng() * 26;
        const px = (t - 0.5) * bl * 0.9;
        const py = offY;
        const dg = ctx.createRadialGradient(px, py, 0, px, py, w);
        dg.addColorStop(0, `rgba(3,5,14,${0.32 * f.milky})`);
        dg.addColorStop(0.6, `rgba(3,5,14,${0.12 * f.milky})`);
        dg.addColorStop(1, "rgba(3,5,14,0)");
        ctx.fillStyle = dg;
        ctx.save();
        ctx.translate(px, py);
        ctx.scale(1, h / w);
        ctx.beginPath();
        ctx.arc(0, 0, w, 0, 6.283);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ---------------- Stars ----------------
    function drawStars(f) {
      if (!starCanvas || f.stars < 0.01) return;
      ctx.save();
      ctx.globalAlpha = f.stars;
      ctx.drawImage(starCanvas, 0, 0, W, H);
      ctx.restore();
    }

    // ---------------- Haze band ----------------
    function drawHaze(f) {
      const bandTop = H * 0.52;
      const g = ctx.createLinearGradient(0, bandTop, 0, H);
      const [r, gg, b] = f.haze;
      g.addColorStop(0.00, `rgba(${r|0},${gg|0},${b|0},0)`);
      g.addColorStop(0.45, `rgba(${r|0},${gg|0},${b|0},${f.hazeA * 0.45})`);
      g.addColorStop(1.00, `rgba(${r|0},${gg|0},${b|0},${f.hazeA})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, bandTop, W, H - bandTop);
    }

    // ---------------- Ridges ----------------
    function drawRidges(f) {
      const stepX = W / (RIDGE_N - 1);
      for (let li = 0; li < ridgeLayers.length; li++) {
        const L = ridgeLayers[li];
        const arr = L.arr;

        const baseY = L.base * H;
        const amp = L.amp * H * f.rough;

        const mix = L.hazeMix;
        const r = f.ridge[0] * (1 - mix) + f.haze[0] * mix;
        const g = f.ridge[1] * (1 - mix) + f.haze[1] * mix;
        const b = f.ridge[2] * (1 - mix) + f.haze[2] * mix;

        ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i < RIDGE_N; i++) {
          ctx.lineTo(i * stepX, baseY - arr[i] * amp);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();
      }
    }

    // ---------------- City lights ----------------
    const CITY = (() => {
      const rng = mulberry32(0xC17Y);
      const out = [];
      for (let i = 0; i < 90; i++) {
        out.push({
          x: rng(),
          r: 0.4 + rng() * 1.1,
          a: 0.35 + rng() * 0.6,
          jitter: (rng() - 0.5) * 0.012
        });
      }
      return out;
    })();

    function drawCities(f) {
      if (f.city < 0.01) return;
      const L = ridgeLayers[2];      // nearest ridge
      const arr = L.arr;
      const baseY = L.base * H;
      const amp = L.amp * H * f.rough;

      ctx.globalAlpha = 1;
      for (const c of CITY) {
        const i = Math.min(RIDGE_N - 1, Math.floor(c.x * (RIDGE_N - 1)));
        const y = baseY - arr[i] * amp + c.jitter * H;
        const x = c.x * W;

        // Warm dot with soft halo
        const halo = ctx.createRadialGradient(x, y - 1.5, 0, x, y - 1.5, 6);
        halo.addColorStop(0, `rgba(255,215,155,${0.30 * f.city * c.a})`);
        halo.addColorStop(1, "rgba(255,215,155,0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(x, y - 1.5, 6, 0, 6.283);
        ctx.fill();

        ctx.fillStyle = `rgba(255,225,175,${0.85 * f.city * c.a})`;
        ctx.beginPath();
        ctx.arc(x, y - 1.5, c.r, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ---------------- Sun ----------------
    function drawSun(f, depth) {
      const sun = f.sun;
      const minSide = Math.min(W, H);
      const sx = sun.x * W;
      const sy = sun.y * H;
      const r = Math.max(1.5, sun.r * minSide);
      const [cr, cg, cb] = sun.color.map(v => v | 0);
      const glow = sun.glow;

      // Wide outer halo
      const haloR = r * (8 + depth * 12);
      const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, haloR);
      halo.addColorStop(0.00, `rgba(${cr},${cg},${cb},${clamp(0.42 * glow * (1 - depth * 0.35), 0, 1)})`);
      halo.addColorStop(0.18, `rgba(${cr},${cg},${cb},${clamp(0.16 * glow, 0, 1)})`);
      halo.addColorStop(0.48, `rgba(${cr},${cg},${cb},${clamp(0.045 * glow, 0, 1)})`);
      halo.addColorStop(1.00, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = halo;
      ctx.fillRect(sx - haloR, sy - haloR, haloR * 2, haloR * 2);

      // Anamorphic streak (horizontal) — the cinematic signature
      if (depth > 0.15 && r > 3) {
        const streakLen = Math.min(W * 0.9, r * 40);
        const sa = clamp(0.20 * glow * (1 - depth * 0.3), 0, 1);
        const sg = ctx.createLinearGradient(sx - streakLen, sy, sx + streakLen, sy);
        sg.addColorStop(0.00, `rgba(${cr},${cg},${cb},0)`);
        sg.addColorStop(0.42, `rgba(${cr},${cg},${cb},${sa * 0.5})`);
        sg.addColorStop(0.50, `rgba(255,255,255,${sa})`);
        sg.addColorStop(0.58, `rgba(${cr},${cg},${cb},${sa * 0.5})`);
        sg.addColorStop(1.00, `rgba(${cr},${cg},${cb},0)`);
        ctx.fillStyle = sg;
        const sh = Math.max(1, r * 0.06 + 1);
        ctx.fillRect(sx - streakLen, sy - sh / 2, streakLen * 2, sh);
      }

      // Disc with limb darkening
      const disc = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      disc.addColorStop(0.00, "rgba(255,255,255,1)");
      disc.addColorStop(0.55, `rgba(${cr},${cg},${cb},1)`);
      disc.addColorStop(0.90, `rgba(${(cr*0.9)|0},${(cg*0.82)|0},${(cb*0.72)|0},1)`);
      disc.addColorStop(1.00, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = disc;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, 6.283);
      ctx.fill();
    }

    // ---------------- Master draw ----------------
    function draw(depth) {
      if (!W || !H || !starCanvas) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const f = frameAt(depth);

      drawSky(f);
      drawMilky(f);
      drawStars(f);
      drawHaze(f);
      drawRidges(f);
      drawCities(f);
      drawSun(f, depth);
    }

    function skyColorAt(depth) {
      const f = frameAt(depth);
      return [
        (f.skyMid[0] * 0.6 + f.skyBot[0] * 0.4) | 0,
        (f.skyMid[1] * 0.6 + f.skyBot[1] * 0.4) | 0,
        (f.skyMid[2] * 0.6 + f.skyBot[2] * 0.4) | 0
      ];
    }

    return { resize, draw, skyColorAt };
  })();

  // ============================================================
  //  Audio
  // ============================================================
  const Sound = (() => {
    let ctx = null, started = false, muted = false;
    let master, bus, filter, sub, subGain, convolver, wetGain, dryGain;
    let oscs = [];

    function makeImpulse(context, duration, decay) {
      const rate = context.sampleRate;
      const len = Math.floor(rate * duration);
      const buf = context.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    function start() {
      if (started) return;
      started = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      if (ctx.state === "suspended") ctx.resume().catch(() => {});

      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);

      convolver = ctx.createConvolver();
      convolver.buffer = makeImpulse(ctx, 5.2, 2.8);

      wetGain = ctx.createGain(); wetGain.gain.value = 0.55;
      dryGain = ctx.createGain(); dryGain.gain.value = 0.62;
      convolver.connect(wetGain).connect(master);
      dryGain.connect(master);

      bus = ctx.createGain();
      bus.connect(dryGain);
      bus.connect(convolver);

      filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;
      filter.Q.value = 0.85;
      filter.connect(bus);

      const specs = [
        { f: 55,   g: 0.50, type: "sine" },
        { f: 82.5, g: 0.28, type: "sine" },
        { f: 110,  g: 0.20, type: "triangle" },
        { f: 165,  g: 0.09, type: "sine" }
      ];
      oscs = specs.map(s => {
        const osc = ctx.createOscillator();
        osc.type = s.type;
        osc.frequency.value = s.f;
        const g = ctx.createGain();
        g.gain.value = s.g;
        osc.connect(g).connect(filter);
        osc.start();
        return { osc, base: s.f };
      });

      sub = ctx.createOscillator();
      sub.type = "sine";
      sub.frequency.value = 55;
      subGain = ctx.createGain();
      subGain.gain.value = 0;
      sub.connect(subGain).connect(master);
      sub.start();

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.061;
      const lfoAmt = ctx.createGain();
      lfoAmt.gain.value = 2.2;
      lfo.connect(lfoAmt);
      oscs.forEach(o => lfoAmt.connect(o.osc.detune));
      lfo.start();

      const breath = ctx.createOscillator();
      breath.frequency.value = 0.033;
      const breathAmt = ctx.createGain();
      breathAmt.gain.value = 0.05;
      breath.connect(breathAmt).connect(master.gain);
      breath.start();

      master.gain.setValueAtTime(0, ctx.currentTime);
      master.gain.linearRampToValueAtTime(muted ? 0 : 0.32, ctx.currentTime + 6);
    }

    function update(depth) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const pitchMul = 1 - depth * 0.55;
      oscs.forEach(({ osc, base }) => osc.frequency.setTargetAtTime(base * pitchMul, t, 0.7));
      filter.frequency.setTargetAtTime(340 + depth * 1700, t, 0.7);
      wetGain.gain.setTargetAtTime(0.55 + depth * 0.22, t, 0.7);
      const subCurve = Math.sin(Math.min(1, depth) * Math.PI) * 0.30;
      subGain.gain.setTargetAtTime(subCurve, t, 1.2);
      sub.frequency.setTargetAtTime(55 - depth * 20, t, 1.2);
    }

    function bell(depth) {
      if (!ctx || muted) return;
      const t = ctx.currentTime;
      const root = 880 - depth * 520;
      [1, 2.01, 3.02, 4.98].forEach((mult, i) => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = Math.max(40, root * mult);
        const g = ctx.createGain();
        const peak = [0.075, 0.028, 0.013, 0.006][i];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 4.6 - i * 1.05);
        osc.connect(g).connect(bus);
        osc.start(t);
        osc.stop(t + 4.8);
      });
    }

    function setMuted(m) {
      muted = m;
      if (!ctx) return;
      master.gain.setTargetAtTime(m ? 0 : 0.32, ctx.currentTime, 0.25);
    }

    return { start, update, bell, setMuted, isStarted: () => started, isMuted: () => muted };
  })();

  // ============================================================
  //  DOM
  // ============================================================
  const numEl     = document.getElementById("num");
  const unitEl    = document.getElementById("unit");
  const lineA     = document.getElementById("lineA");
  const lineB     = document.getElementById("lineB");
  const sourceEl  = document.getElementById("source");
  const hintEl    = document.getElementById("hint");
  const endnoteEl = document.getElementById("endnote");
  const railEl    = document.getElementById("rail");
  const liveEl    = document.getElementById("live");
  const playBtn   = document.getElementById("playBtn");
  const nowBtn    = document.getElementById("nowBtn");
  const randomBtn = document.getElementById("randomBtn");
  const shareBtn  = document.getElementById("shareBtn");
  const muteBtn   = document.getElementById("muteBtn");

  // ============================================================
  //  State
  // ============================================================
  const state = {
    p: 0, years: 0, depth: 0,
    lastSky: null,
    lastNum: "Now", lastUnit: "",
    lastMilestone: -1,
    activeLine: lineA,
    started: false, playing: false, lastTick: 0,
    lastRendered: -1
  };

  // ============================================================
  //  Rail
  // ============================================================
  const railTicks = [];
  (() => {
    MILESTONES.forEach((m, i) => {
      if (m.y === 0) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rail-tick";
      btn.style.top = (yearsToScroll(m.y) * 100) + "%";
      const f = fmt(m.y);
      const label = `${f.n}${f.u ? " " + f.u : ""}`;
      btn.setAttribute("aria-label", `Jump to ${label}`);
      btn.title = `${label} — ${m.line}`;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        begin();
        window.scrollTo({ top: yearsToScroll(m.y) * maxScroll(), behavior: "smooth" });
      });
      railEl.appendChild(btn);
      railTicks.push({ el: btn, index: i });
    });
    const head = document.createElement("div");
    head.className = "rail-head";
    railEl.appendChild(head);
    railEl._head = head;
  })();

  (() => {
    let dragging = false;
    function setFromEvent(e) {
      const r = railEl.getBoundingClientRect();
      const y = Math.min(r.bottom, Math.max(r.top, e.clientY));
      begin();
      window.scrollTo({ top: ((y - r.top) / (r.height || 1)) * maxScroll(), behavior: "auto" });
    }
    railEl.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".rail-tick")) return;
      dragging = true;
      railEl.setPointerCapture(e.pointerId);
      setFromEvent(e);
      e.preventDefault();
    });
    railEl.addEventListener("pointermove", (e) => { if (dragging) setFromEvent(e); });
    const end = (e) => {
      dragging = false;
      try { railEl.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    railEl.addEventListener("pointerup", end);
    railEl.addEventListener("pointercancel", end);
  })();

  // ============================================================
  //  Milestone
  // ============================================================
  function setMilestone(index) {
    if (index === state.lastMilestone) return;
    state.lastMilestone = index;

    const next = state.activeLine === lineA ? lineB : lineA;
    const prev = state.activeLine;

    next.textContent = MILESTONES[index].line;
    void next.offsetWidth;

    next.classList.add("active");
    next.classList.remove("leaving");
    prev.classList.remove("active");
    prev.classList.add("leaving");

    next.setAttribute("aria-hidden", "false");
    prev.setAttribute("aria-hidden", "true");
    state.activeLine = next;

    const s = MILESTONES[index].source;
    if (s) { sourceEl.textContent = s; sourceEl.classList.add("visible"); }
    else   { sourceEl.classList.remove("visible"); }

    liveEl.textContent = MILESTONES[index].line;
    if (Sound.isStarted()) Sound.bell(depthOf(MILESTONES[index].y));
  }

  // ============================================================
  //  Bootstrap
  // ============================================================
  function begin() {
    if (state.started) return;
    state.started = true;
    Sound.start();
  }
  ["pointerdown", "keydown", "touchstart", "wheel"].forEach(ev => {
    window.addEventListener(ev, begin, { once: true, passive: true });
  });

  // ============================================================
  //  Render
  // ============================================================
  function render() {
    const years = state.years;
    state.depth = depthOf(years);

    const f = fmt(years);
    if (f.n !== state.lastNum) { numEl.textContent = f.n; state.lastNum = f.n; }
    if (f.u !== state.lastUnit) { unitEl.textContent = f.u; state.lastUnit = f.u; }

    let mi = 0;
    for (let i = 0; i < MILESTONES.length; i++) {
      if (MILESTONES[i].y <= years) mi = i; else break;
    }
    setMilestone(mi);

    const sky = Scenery.skyColorAt(state.depth);
    if (!state.lastSky ||
        state.lastSky[0] !== sky[0] ||
        state.lastSky[1] !== sky[1] ||
        state.lastSky[2] !== sky[2]) {
      state.lastSky = sky;
      document.body.style.backgroundColor = `rgb(${sky[0]},${sky[1]},${sky[2]})`;
    }

    railEl._head.style.top = (state.p * 100) + "%";
    for (const t of railTicks) t.el.dataset.active = String(t.index === mi);

    hintEl.classList.toggle("hidden", state.p > 0.004);
    endnoteEl.classList.toggle("visible", state.p > 0.988);

    Sound.update(state.depth);
    scheduleHashWrite();
  }

  function onScroll() {
    const p = Math.min(1, Math.max(0, window.scrollY / maxScroll()));
    state.p = p;
    state.years = scrollToYears(p);
    render();
  }

  // ============================================================
  //  Hash
  // ============================================================
  let hashTimer = 0, suppressHash = false;
  function scheduleHashWrite() {
    if (suppressHash) return;
    clearTimeout(hashTimer);
    hashTimer = setTimeout(() => {
      const y = state.years;
      const h = y < 1 ? "" : "#y=" + Math.round(y);
      if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    }, 350);
  }
  function readHash() {
    const m = /^#y=(\d+)$/.exec(location.hash);
    if (!m) return null;
    const y = parseInt(m[1], 10);
    if (!isFinite(y) || y < 1) return null;
    return Math.min(MAX_YEARS, y);
  }

  // ============================================================
  //  Autoplay + buttons
  // ============================================================
  const PLAY_RATE = 0.012;
  function setPlaying(on) {
    state.playing = on;
    playBtn.setAttribute("aria-pressed", String(on));
    playBtn.textContent = on ? "Pause" : "Play";
    playBtn.setAttribute("aria-label", on ? "Pause the journey" : "Play the journey");
    if (on) {
      begin();
      state.lastTick = performance.now();
      if (state.p >= 0.999) window.scrollTo({ top: 0, behavior: "auto" });
    }
  }
  playBtn.addEventListener("click", () => setPlaying(!state.playing));

  nowBtn.addEventListener("click", () => {
    begin(); setPlaying(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  randomBtn.addEventListener("click", () => {
    begin(); setPlaying(false);
    const p = HOLD + Math.random() * (1 - HOLD);
    window.scrollTo({ top: p * maxScroll(), behavior: "smooth" });
  });

  shareBtn.addEventListener("click", async () => {
    begin();
    const y = state.years;
    const h = y < 1 ? "" : "#y=" + Math.round(y);
    const url = location.origin + location.pathname + location.search + h;
    const f = fmt(y);
    const title = y < 1
      ? "The Deep Future Clock — right now"
      : `The Deep Future Clock — ${f.n}${f.u ? " " + f.u : ""} from now`;
    try {
      if (navigator.share) await navigator.share({ title, url });
      else if (navigator.clipboard) { await navigator.clipboard.writeText(url); flashButton(shareBtn, "Copied"); }
      else prompt("Copy this link:", url);
    } catch (_) {}
  });

  muteBtn.addEventListener("click", () => {
    begin();
    const next = !Sound.isMuted();
    Sound.setMuted(next);
    muteBtn.setAttribute("aria-pressed", String(next));
    muteBtn.textContent = next ? "Muted" : "Sound";
    muteBtn.setAttribute("aria-label", next ? "Unmute sound" : "Mute sound");
  });

  function flashButton(btn, text) {
    const original = btn.textContent;
    btn.textContent = text;
    btn.dataset.flash = "true";
    setTimeout(() => { btn.textContent = original; delete btn.dataset.flash; }, 1400);
  }

  // ============================================================
  //  Keyboard
  // ============================================================
  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;
    const max = maxScroll();
    const small = window.innerHeight * 0.6;
    const big = window.innerHeight * 2.4;
    switch (e.key) {
      case "ArrowDown": window.scrollBy(0, small); e.preventDefault(); break;
      case "ArrowUp":   window.scrollBy(0, -small); e.preventDefault(); break;
      case "PageDown":  window.scrollBy(0, big); e.preventDefault(); break;
      case "PageUp":    window.scrollBy(0, -big); e.preventDefault(); break;
      case "Home":      setPlaying(false); window.scrollTo({ top: 0, behavior: "smooth" }); e.preventDefault(); break;
      case "End":       setPlaying(false); window.scrollTo({ top: max, behavior: "smooth" }); e.preventDefault(); break;
      case " ":
        if (!e.shiftKey) { setPlaying(!state.playing); e.preventDefault(); }
        break;
      case "r": case "R": randomBtn.click(); break;
      case "s": case "S": shareBtn.click(); break;
      case "m": case "M": muteBtn.click(); break;
    }
  });

  // ============================================================
  //  Loop
  // ============================================================
  function loop(t) {
    if (state.playing) {
      const dt = Math.min(0.05, (t - state.lastTick) / 1000);
      state.lastTick = t;
      const max = maxScroll();
      const next = Math.min(max, window.scrollY + max * PLAY_RATE * dt);
      if (next >= max - 0.5) setPlaying(false);
      else window.scrollTo(0, next);
    } else {
      state.lastTick = t;
    }

    if (Math.abs(state.depth - state.lastRendered) > 0.0001) {
      Scenery.draw(state.depth);
      state.lastRendered = state.depth;
    }
    requestAnimationFrame(loop);
  }

  // ============================================================
  //  Resize + init
  // ============================================================
  let resizeRaf = 0;
  function onResize() {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      Scenery.resize();
      state.lastRendered = -1;
      Scenery.draw(state.depth);
      onScroll();
    });
  }

  function init() {
    Scenery.resize();
    Scenery.draw(0);
    state.lastRendered = 0;

    const fromHash = readHash();
    if (fromHash) {
      suppressHash = true;
      window.scrollTo({ top: yearsToScroll(fromHash) * maxScroll(), behavior: "auto" });
      requestAnimationFrame(() => { onScroll(); suppressHash = false; });
    } else {
      onScroll();
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onResize, { passive: true });
  window.addEventListener("orientationchange", onResize, { passive: true });
  window.addEventListener("hashchange", () => {
    const y = readHash();
    if (y != null) {
      suppressHash = true;
      window.scrollTo({ top: yearsToScroll(y) * maxScroll(), behavior: "auto" });
      requestAnimationFrame(() => { suppressHash = false; });
    }
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
