<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<meta name="description" content="A clock that scrolls through deep time, from now to the death of the Sun.">
<title>The Deep Future Clock</title>
<style>
  :root {
    --fg: #ece9e2;
    --dim: rgba(236, 233, 226, 0.55);
    --bg: #05070d;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    overscroll-behavior: none;
    scrollbar-width: none;
    -webkit-tap-highlight-color: transparent;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #sky {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
  }

  /* Vignette only — no movement, no grain, no flash */
  .veil {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 140% 100% at 50% 55%,
        transparent 34%,
        rgba(0,0,0,.28) 68%,
        rgba(0,0,0,.72) 100%);
  }

  .stage {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding: 8vmin 6vmin 16vmin;
    pointer-events: none;
    text-align: center;
  }
  .readout {
    width: 100%;
    max-width: 24ch;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .number {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1, "ss01" 1;
    line-height: .92;
    text-shadow: 0 0 70px rgba(0,0,0,.75), 0 2px 14px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .12em;
  }
  #num {
    font-size: clamp(2.6rem, 12.5vw, 9.5rem);
    font-weight: 200;
    letter-spacing: -0.048em;
    white-space: nowrap;
    display: block;
  }
  #unit {
    font-size: clamp(.68rem, 1.55vw, .98rem);
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--dim);
    display: block;
    min-height: 1.2em;
  }
  .rule {
    width: clamp(44px, 8vw, 96px);
    height: 1px;
    background: currentColor;
    opacity: .22;
    margin: clamp(1.7rem, 4.2vh, 2.8rem) auto clamp(1.4rem, 3.4vh, 2.2rem);
  }
  .milestones {
    display: grid;
    place-items: center;
    min-height: 5.6em;
    width: 100%;
  }
  .line {
    grid-area: 1 / 1;
    margin: 0;
    max-width: 26ch;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.05rem, 2.5vw, 1.72rem);
    line-height: 1.36;
    color: rgba(236, 233, 226, 0.94);
    opacity: 0;
    transform: translateY(6px);
    transition:
      opacity 950ms cubic-bezier(.2,.6,.2,1),
      transform 950ms cubic-bezier(.2,.6,.2,1);
    text-wrap: balance;
    text-shadow: 0 2px 26px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.6);
  }
  .line.active { opacity: 1; transform: translateY(0); }
  .line.leaving { opacity: 0; transform: translateY(-6px); }

  .source {
    margin: clamp(1.1rem, 2.6vh, 1.8rem) 0 0;
    font-family: var(--sans);
    font-size: clamp(.62rem, 1.15vw, .74rem);
    letter-spacing: .24em;
    text-transform: uppercase;
    color: rgba(236, 233, 226, 0.34);
    opacity: 0;
    transition: opacity 900ms ease;
  }
  .source.visible { opacity: 1; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: max(6vh, env(safe-area-inset-bottom, 0px) + 4vh);
    transform: translateX(-50%);
    z-index: 4;
    font-size: .66rem;
    letter-spacing: .44em;
    text-transform: uppercase;
    color: var(--dim);
    transition: opacity 800ms ease;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1em;
  }
  .hint.hidden { opacity: 0; }
  .hint .chev {
    width: 1px; height: 28px;
    background: linear-gradient(to bottom, transparent, var(--dim));
  }

  .endnote {
    position: fixed;
    left: 50%;
    bottom: max(9vh, env(safe-area-inset-bottom, 0px) + 7vh);
    transform: translate(-50%, 10px);
    z-index: 4;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(.98rem, 2vw, 1.3rem);
    color: rgba(236,233,226,.82);
    opacity: 0;
    transition: opacity 1500ms ease, transform 1500ms ease;
    pointer-events: none;
    text-align: center;
    width: min(90vw, 42ch);
    text-shadow: 0 2px 28px rgba(0,0,0,.85);
  }
  .endnote.visible { opacity: 1; transform: translate(-50%, 0); }

  .rail {
    position: fixed;
    right: clamp(16px, 2.4vw, 32px);
    top: 16vh;
    height: 68vh;
    width: 2px;
    z-index: 5;
    background: linear-gradient(to bottom,
      transparent,
      rgba(255,255,255,.12) 6%,
      rgba(255,255,255,.12) 94%,
      transparent);
    pointer-events: auto;
    cursor: pointer;
    touch-action: none;
  }
  .rail::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -18px; right: -18px;
  }
  .rail-tick {
    position: absolute;
    right: -8px;
    width: 18px; height: 18px;
    margin: 0; padding: 0;
    background: none; border: 0;
    cursor: pointer;
    pointer-events: auto;
    transform: translateY(-50%);
    display: grid; place-items: center;
  }
  .rail-tick::after {
    content: "";
    width: 7px; height: 1px;
    background: rgba(255,255,255,.34);
    transition: width 240ms ease, background 240ms ease;
  }
  .rail-tick:hover::after,
  .rail-tick:focus-visible::after,
  .rail-tick[data-active="true"]::after {
    width: 13px;
    background: rgba(255,255,255,.95);
  }
  .rail-tick:focus-visible { outline: none; }
  .rail-head {
    position: absolute;
    right: -5px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 14px rgba(236,233,226,.6), 0 0 3px rgba(236,233,226,.95);
    transform: translateY(-50%);
    pointer-events: none;
  }
  @media (max-width: 720px) { .rail { display: none; } }

  .controls {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 0 12px;
    max-width: 100vw;
  }
  .controls button {
    appearance: none;
    background: rgba(15,15,20,.44);
    border: 1px solid rgba(255,255,255,.10);
    color: var(--dim);
    font: inherit;
    font-size: .64rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: .6em 1.05em;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: color 200ms ease, border-color 200ms ease, background 200ms ease;
    white-space: nowrap;
  }
  .controls button:hover {
    color: var(--fg);
    border-color: rgba(255,255,255,.26);
    background: rgba(30,30,40,.58);
  }
  .controls button:focus-visible {
    outline: 1px solid rgba(255,255,255,.55);
    outline-offset: 2px;
  }
  .controls button[aria-pressed="true"] {
    color: rgba(255,255,255,.42);
    border-color: rgba(255,255,255,.06);
    background: rgba(15,15,20,.28);
  }
  .controls button[data-flash="true"] {
    color: #fff;
    border-color: rgba(255,255,255,.55);
  }

  .spacer { height: 1400vh; }

  @media (prefers-reduced-motion: reduce) {
    .line { transition-duration: 240ms; }
    .endnote { transition-duration: 400ms; }
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main class="stage">
  <div class="readout">
    <div class="number" id="number">
      <span id="num">Now</span>
      <span id="unit"></span>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div class="milestones">
      <p class="line active" id="lineA">You are here.</p>
      <p class="line" id="lineB" aria-hidden="true"></p>
    </div>
    <p class="source" id="source"></p>
  </div>
</main>

<nav class="rail" id="rail" aria-label="Timeline navigation"></nav>

<div class="controls" role="group" aria-label="Controls">
  <button id="playBtn" type="button" aria-label="Play the journey" aria-pressed="false">Play</button>
  <button id="nowBtn" type="button" aria-label="Return to now">Now</button>
  <button id="randomBtn" type="button" aria-label="Jump to a random future">Random</button>
  <button id="shareBtn" type="button" aria-label="Copy a link to this moment">Share</button>
  <button id="muteBtn" type="button" aria-label="Mute sound" aria-pressed="false">Sound</button>
</div>

<div class="hint" id="hint" aria-hidden="true">
  <span>Scroll</span>
  <span class="chev"></span>
</div>

<div class="endnote" id="endnote">None of this matters. That&rsquo;s okay.</div>

<p id="live" class="sr" aria-live="polite"></p>

<div class="spacer"></div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  Config
  // ============================================================
  const MAX_YEARS = 8_000_000_000;
  const MAX_LOG   = Math.log10(MAX_YEARS);
  const HOLD      = 0.02;
  const REDUCED   = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const MILESTONES = [
    { y: 0,             line: "You are here.",                                     source: "" },
    { y: 50,            line: "The last person who remembers you will likely be gone.", source: "Memory & mortality" },
    { y: 200,           line: "Everyone alive today will be gone.",                source: "Maximum human lifespan" },
    { y: 1_000,         line: "English will be unintelligible to modern ears.",   source: "Historical linguistics" },
    { y: 10_000,        line: "The Sahara will be green again.",                   source: "Milankovitch cycles" },
    { y: 50_000,        line: "Niagara Falls will have eroded away.",              source: "Erosion rates" },
    { y: 100_000,       line: "The night sky will be unrecognizable.",             source: "Stellar proper motion" },
    { y: 1_000_000,     line: "Most of what we built will have vanished.",         source: "Material degradation" },
    { y: 2_000_000,     line: "New species of humans may walk the Earth.",         source: "Speciation timescales" },
    { y: 50_000_000,    line: "The Mediterranean will close.",                     source: "Plate tectonics" },
    { y: 250_000_000,   line: "The continents will merge into Pangaea Ultima.",    source: "Plate tectonics models" },
    { y: 600_000_000,   line: "Total solar eclipses will cease.",                  source: "Lunar recession" },
    { y: 1_000_000_000, line: "The Sun will be 10% brighter. Earth is hotter.",    source: "Stellar evolution" },
    { y: 2_500_000_000, line: "The outer core freezes. The magnetic field fails.", source: "Geodynamo modeling" },
    { y: 5_000_000_000, line: "The Sun exhausts its hydrogen and begins to swell.",source: "Stellar evolution" },
    { y: 7_900_000_000, line: "The Sun swallows the Earth.",                       source: "Red giant expansion" }
  ];

  // ============================================================
  //  Time <-> scroll
  // ============================================================
  const scrollToYears = p => p <= HOLD ? 0 : Math.pow(10, ((p - HOLD) / (1 - HOLD)) * MAX_LOG);
  const yearsToScroll = y => y <= 1 ? 0 : HOLD + (Math.log10(y) / MAX_LOG) * (1 - HOLD);
  const depthOf       = y => y <= 1 ? 0 : Math.log10(y) / MAX_LOG;
  const maxScroll     = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);

  function fmt(y) {
    if (y < 1) return { n: "Now", u: "" };
    if (y < 10) return { n: String(Math.round(y * 10) / 10), u: "years" };
    if (y < 1_000) return { n: String(Math.round(y)), u: "years" };
    if (y < 1_000_000) return { n: Math.round(y).toLocaleString("en-US"), u: "years" };
    const scales = [{ div: 1e9, u: "billion years" }, { div: 1e6, u: "million years" }];
    for (const s of scales) {
      if (y >= s.div) {
        const v = y / s.div;
        const n = v < 100 ? String(Math.round(v * 10) / 10) : String(Math.round(v));
        return { n, u: s.u };
      }
    }
    return { n: String(Math.round(y)), u: "years" };
  }

  const lerp  = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const smooth = t => t * t * (3 - 2 * t);

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ============================================================
  //  Static scene — painted once, then graded per frame
  // ============================================================
  const Sky = (() => {
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d", { alpha: false });

    let W = 0, H = 0, dpr = 1;
    let base = null;          // offscreen painted scene
    let baseW = 0, baseH = 0; // physical pixel size of base

    // Fixed normalized points — never change, so nothing ever moves
    let brightStars = [];     // sparse foreground stars
    let milkyStars  = [];     // stars inside the band
    let dustLanes   = [];     // dark ellipses over the band

    // The band runs from top-left to bottom-right
    const BAND_ANGLE = -0.62; // radians, roughly -35°

    function buildPoints() {
      const rng = mulberry32(0xDEEF);

      // Milky Way: dense band of small stars
      milkyStars = [];
      const MN = 2600;
      for (let i = 0; i < MN; i++) {
        const t = rng();                       // along the band
        // Gaussian-ish perpendicular offset
        const g = (rng() + rng() + rng() + rng() - 2) / 2;
        const off = g * 0.13;
        const jitter = (rng() - 0.5) * 0.05;

        const cx = 0.5, cy = 0.5;
        const dx = Math.cos(BAND_ANGLE);
        const dy = Math.sin(BAND_ANGLE);
        const nx = -dy, ny = dx;

        const x = cx + (t - 0.5) * 1.6 * dx + off * nx + jitter;
        const y = cy + (t - 0.5) * 1.6 * dy + off * ny + jitter;

        milkyStars.push({
          x, y,
          r: 0.20 + Math.pow(rng(), 2.4) * 0.75,
          a: 0.16 + rng() * 0.5,
          // slight color drift: bluer in the band core, warmer at edges
          warmth: clamp(Math.abs(off) * 8 + (rng() - 0.5) * 0.3, 0, 1)
        });
      }

      // Foreground bright stars
      brightStars = [];
      const BN = 320;
      for (let i = 0; i < BN; i++) {
        brightStars.push({
          x: rng(),
          y: rng(),
          r: 0.35 + Math.pow(rng(), 3) * 1.55,
          a: 0.42 + rng() * 0.55,
          warmth: rng()
        });
      }

      // Dust lanes — long dark blobs running along the band
      dustLanes = [];
      const DN = 14;
      for (let i = 0; i < DN; i++) {
        dustLanes.push({
          t: rng(),
          w: 0.10 + rng() * 0.28,
          h: 0.012 + rng() * 0.035,
          a: 0.35 + rng() * 0.5
        });
      }
    }

    // ---- Paint the base scene once ----
    function paintBase() {
      // Offscreen at physical resolution, so it stays 1:1 with the canvas
      base = document.createElement("canvas");
      base.width = baseW;
      base.height = baseH;
      const c = base.getContext("2d");
      c.scale(dpr, dpr);   // we work in CSS pixels inside

      // ------ 1. Deep space gradient ------
      const sky = c.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0.00, "#02030a");
      sky.addColorStop(0.35, "#060915");
      sky.addColorStop(0.62, "#0a0c1c");
      sky.addColorStop(0.85, "#0d0a18");
      sky.addColorStop(1.00, "#120817");
      c.fillStyle = sky;
      c.fillRect(0, 0, W, H);

      // ------ 2. Broad nebula washes (very soft) ------
      const washes = [
        { x: 0.24, y: 0.30, r: 0.70, c: [ 46,  58, 120], a: 0.16 },
        { x: 0.78, y: 0.36, r: 0.62, c: [118,  56, 118], a: 0.11 },
        { x: 0.50, y: 0.72, r: 0.75, c: [ 44,  72, 108], a: 0.10 },
        { x: 0.15, y: 0.68, r: 0.55, c: [150,  72,  66], a: 0.07 }
      ];
      for (const w of washes) {
        const gx = w.x * W, gy = w.y * H, gr = w.r * Math.min(W, H);
        const g = c.createRadialGradient(gx, gy, 0, gx, gy, gr);
        const [r, gg, b] = w.c;
        g.addColorStop(0, `rgba(${r},${gg},${b},${w.a})`);
        g.addColorStop(0.45, `rgba(${r},${gg},${b},${w.a * 0.35})`);
        g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        c.fillStyle = g;
        c.fillRect(0, 0, W, H);
      }

      // ------ 3. Milky Way soft glow (under the stars) ------
      const bw = Math.min(W, H) * 0.34;
      const cx = W * 0.5, cy = H * 0.5;
      const bx1 = cx - Math.cos(BAND_ANGLE) * W * 0.85;
      const by1 = cy - Math.sin(BAND_ANGLE) * W * 0.85;
      const bx2 = cx + Math.cos(BAND_ANGLE) * W * 0.85;
      const by2 = cy + Math.sin(BAND_ANGLE) * W * 0.85;

      const bandGrad = c.createLinearGradient(
        bx1 + -Math.sin(BAND_ANGLE) * bw, by1 + Math.cos(BAND_ANGLE) * bw,
        bx1 +  Math.sin(BAND_ANGLE) * bw, by1 - Math.cos(BAND_ANGLE) * bw
      );
      bandGrad.addColorStop(0.00, "rgba(140,160,220,0)");
      bandGrad.addColorStop(0.42, "rgba(160,180,230,0.10)");
      bandGrad.addColorStop(0.50, "rgba(200,215,255,0.16)");
      bandGrad.addColorStop(0.58, "rgba(160,180,230,0.10)");
      bandGrad.addColorStop(1.00, "rgba(140,160,220,0)");

      c.save();
      // Clip to a thick diagonal strip so the glow hugs the band
      c.translate(cx, cy);
      c.rotate(BAND_ANGLE);
      c.fillStyle = bandGrad;
      c.fillRect(-W, -bw, W * 2, bw * 2);
      c.restore();

      // ------ 4. Milky Way star field ------
      for (const s of milkyStars) {
        const x = s.x * W;
        const y = s.y * H;
        if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
        const r = s.r;
        const a = s.a;
        // cool → warm color drift
        const cr = Math.round(200 + 55 * s.warmth);
        const cg = Math.round(210 + 30 * s.warmth);
        const cb = Math.round(245 - 40 * s.warmth);
        c.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
      }

      // ------ 5. Dust lanes (dark bands over the milky way) ------
      for (const d of dustLanes) {
        const x = (0.5 + (d.t - 0.5) * Math.cos(BAND_ANGLE) * 1.6) * W;
        const y = (0.5 + (d.t - 0.5) * Math.sin(BAND_ANGLE) * 1.6) * H;
        const rx = d.w * W * 0.5;
        const ry = d.h * H * 0.5;
        const g = c.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
        g.addColorStop(0, `rgba(2,4,12,${d.a})`);
        g.addColorStop(0.6, `rgba(2,4,12,${d.a * 0.4})`);
        g.addColorStop(1, "rgba(2,4,12,0)");
        c.save();
        c.translate(x, y);
        c.rotate(BAND_ANGLE);
        c.scale(1, ry / Math.max(rx, ry));
        c.translate(-x, -y);
        c.fillStyle = g;
        c.beginPath();
        c.arc(x, y, Math.max(rx, ry), 0, Math.PI * 2);
        c.fill();
        c.restore();
      }

      // ------ 6. Foreground bright stars + halos ------
      for (const s of brightStars) {
        const x = s.x * W;
        const y = s.y * H;
        const r = s.r;
        const a = s.a;

        // tiny cross/glow for the brightest
        if (r > 1.35) {
          const halo = c.createRadialGradient(x, y, 0, x, y, r * 6);
          const cr = Math.round(240 + 15 * s.warmth);
          const cg = Math.round(238 + 12 * s.warmth);
          const cb = Math.round(246 - 20 * s.warmth);
          halo.addColorStop(0, `rgba(${cr},${cg},${cb},${a * 0.55})`);
          halo.addColorStop(0.4, `rgba(${cr},${cg},${cb},${a * 0.12})`);
          halo.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          c.fillStyle = halo;
          c.beginPath();
          c.arc(x, y, r * 6, 0, Math.PI * 2);
          c.fill();
        }

        c.fillStyle = `rgba(245,246,252,${a})`;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
      }

      // ------ 7. Planet silhouette (arc at bottom) ------
      const planetHorizon = H * 0.74;
      const planetR       = Math.max(W, H) * 1.45;
      const pcx           = W * 0.5;
      const pcy           = planetHorizon + planetR * 0.78;

      // Solid dark disc
      c.beginPath();
      c.arc(pcx, pcy, planetR, Math.PI, 0, false);
      c.closePath();
      const planetGrad = c.createLinearGradient(0, planetHorizon, 0, H);
      planetGrad.addColorStop(0, "#05060c");
      planetGrad.addColorStop(0.5, "#020309");
      planetGrad.addColorStop(1, "#000000");
      c.fillStyle = planetGrad;
      c.fill();

      // ------ 8. Atmospheric rim (the beautiful part) ------
      // A soft band of blue-white light hugging the planet's limb,
      // strongest toward the upper-left (where the sun is coming from).
      c.save();
      c.beginPath();
      c.arc(pcx, pcy, planetR, Math.PI, 0, false);
      c.closePath();
      c.clip();

      // Big radial glow anchored to the planet's top edge
      const rimY = planetHorizon;
      const rimGrad = c.createRadialGradient(
        pcx, rimY + planetR * 0.02, 0,
        pcx, rimY + planetR * 0.02, planetR * 0.30
      );
      rimGrad.addColorStop(0.00, "rgba(150,200,255,0.55)");
      rimGrad.addColorStop(0.25, "rgba(120,170,235,0.24)");
      rimGrad.addColorStop(0.60, "rgba( 80,120,190,0.07)");
      rimGrad.addColorStop(1.00, "rgba( 60, 90,150,0)");
      c.fillStyle = rimGrad;
      c.fillRect(0, planetHorizon - planetR * 0.35, W, planetR * 0.4);

      // Extra-hot left edge (subsolar point)
      const rimGrad2 = c.createRadialGradient(
        pcx - W * 0.18, rimY, 0,
        pcx - W * 0.18, rimY, W * 0.5
      );
      rimGrad2.addColorStop(0, "rgba(210,230,255,0.32)");
      rimGrad2.addColorStop(0.5, "rgba(140,180,240,0.08)");
      rimGrad2.addColorStop(1, "rgba(100,140,220,0)");
      c.fillStyle = rimGrad2;
      c.fillRect(0, planetHorizon - 2, W, 3);
      c.fillRect(0, planetHorizon - 2, W, 60);

      c.restore();

      // Sharp thin line right at the limb
      c.beginPath();
      c.arc(pcx, pcy, planetR, Math.PI, 0, false);
      c.strokeStyle = "rgba(200,220,255,0.32)";
      c.lineWidth = 1.1;
      c.stroke();
    }

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width  = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      baseW = canvas.width;
      baseH = canvas.height;

      if (!milkyStars.length) buildPoints();
      paintBase();

      // Reset transform; the base is drawn 1:1 in physical pixels
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ---- Per-frame grade color for a given depth ----
    function gradeAt(depth) {
      // Stops: [ depth, multiplyTint, screenWash, sunHue, sunGlowStrength ]
      const stops = [
        { d: 0.00, mul: [210, 220, 255], mulA: 0.10, scr: [ 60,  80, 140], scrA: 0.00, sun: [232, 236, 248], glow: 0.55 },
        { d: 0.18, mul: [220, 210, 245], mulA: 0.12, scr: [ 70,  70, 150], scrA: 0.02, sun: [236, 232, 240], glow: 0.60 },
        { d: 0.40, mul: [255, 225, 200], mulA: 0.18, scr: [150, 100,  70], scrA: 0.08, sun: [255, 224, 170], glow: 0.85 },
        { d: 0.58, mul: [255, 200, 170], mulA: 0.26, scr: [180, 110,  60], scrA: 0.14, sun: [255, 200, 150], glow: 1.15 },
        { d: 0.72, mul: [255, 170, 140], mulA: 0.34, scr: [200, 100,  60], scrA: 0.20, sun: [255, 180, 130], glow: 1.45 },
        { d: 0.86, mul: [255, 140, 110], mulA: 0.44, scr: [220,  90,  50], scrA: 0.28, sun: [255, 160, 110], glow: 1.85 },
        { d: 0.94, mul: [255, 130, 100], mulA: 0.55, scr: [230, 110,  70], scrA: 0.34, sun: [255, 190, 140], glow: 2.25 },
        { d: 1.00, mul: [255, 230, 210], mulA: 0.80, scr: [255, 240, 220], scrA: 0.55, sun: [255, 248, 235], glow: 3.10 }
      ];
      if (depth <= stops[0].d) return stops[0];
      const last = stops[stops.length - 1];
      if (depth >= last.d) return last;
      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i], b = stops[i + 1];
        if (depth >= a.d && depth <= b.d) {
          const t = smooth((depth - a.d) / (b.d - a.d));
          return {
            mul: [
              lerp(a.mul[0], b.mul[0], t),
              lerp(a.mul[1], b.mul[1], t),
              lerp(a.mul[2], b.mul[2], t)
            ],
            mulA: lerp(a.mulA, b.mulA, t),
            scr: [
              lerp(a.scr[0], b.scr[0], t),
              lerp(a.scr[1], b.scr[1], t),
              lerp(a.scr[2], b.scr[2], t)
            ],
            scrA: lerp(a.scrA, b.scrA, t),
            sun: [
              lerp(a.sun[0], b.sun[0], t),
              lerp(a.sun[1], b.sun[1], t),
              lerp(a.sun[2], b.sun[2], t)
            ],
            glow: lerp(a.glow, b.glow, t)
          };
        }
      }
      return stops[0];
    }

    // ---- Sun disc: fixed position, grows with depth ----
    function drawSun(depth, grade) {
      const minSide = Math.min(W, H);

      // Position: high and right at the start, sinks toward the horizon
      const sx = lerp(0.78, 0.50, smooth(depth)) * W;
      const sy = lerp(0.22, 0.60, smooth(depth)) * H;

      // Radius: pinprick → half the screen
      const rN = lerp(0.008, 0.55, Math.pow(depth, 1.15));
      const r  = rN * minSide;

      const [cr, cg, cb] = grade.sun.map(v => v | 0);
      const glow = grade.glow;

      // Outer halo (very wide, very soft)
      const haloR = r * 7;
      const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, haloR);
      halo.addColorStop(0,    `rgba(${cr},${cg},${cb},${clamp(0.42 * glow * (1 - depth * 0.4), 0, 1)})`);
      halo.addColorStop(0.20, `rgba(${cr},${cg},${cb},${clamp(0.14 * glow, 0, 1)})`);
      halo.addColorStop(0.55, `rgba(${cr},${cg},${cb},${clamp(0.035 * glow, 0, 1)})`);
      halo.addColorStop(1,    `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = halo;
      ctx.fillRect(sx - haloR, sy - haloR, haloR * 2, haloR * 2);

      // Disc — brighter core, warmer edge (limb darkening)
      const disc = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(1, r));
      disc.addColorStop(0.00, `rgba(255,255,255,1)`);
      disc.addColorStop(0.55, `rgba(${cr},${cg},${cb},1)`);
      disc.addColorStop(0.90, `rgba(${(cr * 0.95) | 0},${(cg * 0.85) | 0},${(cb * 0.75) | 0},1)`);
      disc.addColorStop(1.00, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = disc;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw(depth) {
      if (!base) return;

      // Reset transform each frame — base and grade are in physical pixels
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // 1. Base scene (1:1, static)
      ctx.drawImage(base, 0, 0);

      // Switch to CSS-pixel space for the grade overlays and sun
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const grade = gradeAt(depth);

      // 2. Multiply — deepens the darks and tints the scene
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = `rgba(${grade.mul[0]|0},${grade.mul[1]|0},${grade.mul[2]|0},${grade.mulA})`;
      ctx.fillRect(0, 0, W, H);

      // 3. Screen — lifts the highlights toward the era's color
      if (grade.scrA > 0.001) {
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = `rgba(${grade.scr[0]|0},${grade.scr[1]|0},${grade.scr[2]|0},${grade.scrA})`;
        ctx.fillRect(0, 0, W, H);
      }

      ctx.globalCompositeOperation = "source-over";

      // 4. Sun on top
      drawSun(depth, grade);
    }

    function skyColorAt(depth) {
      const g = gradeAt(depth);
      return [
        Math.min(255, 6 + g.scr[0] * g.scrA + g.mul[0] * g.mulA * 0.15),
        Math.min(255, 8 + g.scr[1] * g.scrA + g.mul[1] * g.mulA * 0.15),
        Math.min(255, 16 + g.scr[2] * g.scrA + g.mul[2] * g.mulA * 0.15)
      ];
    }

    return { resize, draw, skyColorAt };
  })();

  // ============================================================
  //  Audio
  // ============================================================
  const Sound = (() => {
    let ctx = null, started = false, muted = false;
    let master, bus, filter, sub, subGain, convolver, wetGain, dryGain;
    let oscs = [];

    function makeImpulse(context, duration, decay) {
      const rate = context.sampleRate;
      const len = Math.floor(rate * duration);
      const buf = context.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    function start() {
      if (started) return;
      started = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      ctx = new AC();
      if (ctx.state === "suspended") ctx.resume().catch(() => {});

      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);

      convolver = ctx.createConvolver();
      convolver.buffer = makeImpulse(ctx, 5.2, 2.8);

      wetGain = ctx.createGain(); wetGain.gain.value = 0.55;
      dryGain = ctx.createGain(); dryGain.gain.value = 0.62;

      convolver.connect(wetGain).connect(master);
      dryGain.connect(master);

      bus = ctx.createGain();
      bus.connect(dryGain);
      bus.connect(convolver);

      filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;
      filter.Q.value = 0.85;
      filter.connect(bus);

      const specs = [
        { f: 55,   g: 0.50, type: "sine" },
        { f: 82.5, g: 0.28, type: "sine" },
        { f: 110,  g: 0.20, type: "triangle" },
        { f: 165,  g: 0.09, type: "sine" }
      ];
      oscs = specs.map(s => {
        const osc = ctx.createOscillator();
        osc.type = s.type;
        osc.frequency.value = s.f;
        const g = ctx.createGain();
        g.gain.value = s.g;
        osc.connect(g).connect(filter);
        osc.start();
        return { osc, base: s.f };
      });

      sub = ctx.createOscillator();
      sub.type = "sine";
      sub.frequency.value = 55;
      subGain = ctx.createGain();
      subGain.gain.value = 0;
      sub.connect(subGain).connect(master);
      sub.start();

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.061;
      const lfoAmt = ctx.createGain();
      lfoAmt.gain.value = 2.2;
      lfo.connect(lfoAmt);
      oscs.forEach(o => lfoAmt.connect(o.osc.detune));
      lfo.start();

      const breath = ctx.createOscillator();
      breath.frequency.value = 0.033;
      const breathAmt = ctx.createGain();
      breathAmt.gain.value = 0.05;
      breath.connect(breathAmt).connect(master.gain);
      breath.start();

      master.gain.setValueAtTime(0, ctx.currentTime);
      master.gain.linearRampToValueAtTime(muted ? 0 : 0.32, ctx.currentTime + 6);
    }

    function update(depth) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const pitchMul = 1 - depth * 0.55;
      oscs.forEach(({ osc, base }) => osc.frequency.setTargetAtTime(base * pitchMul, t, 0.7));
      filter.frequency.setTargetAtTime(340 + depth * 1700, t, 0.7);
      wetGain.gain.setTargetAtTime(0.55 + depth * 0.22, t, 0.7);
      const subCurve = Math.sin(Math.min(1, depth) * Math.PI) * 0.30;
      subGain.gain.setTargetAtTime(subCurve, t, 1.2);
      sub.frequency.setTargetAtTime(55 - depth * 20, t, 1.2);
    }

    function bell(depth) {
      if (!ctx || muted) return;
      const t = ctx.currentTime;
      const root = 880 - depth * 520;
      [1, 2.01, 3.02, 4.98].forEach((mult, i) => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = Math.max(40, root * mult);
        const g = ctx.createGain();
        const peak = [0.075, 0.028, 0.013, 0.006][i];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 4.6 - i * 1.05);
        osc.connect(g).connect(bus);
        osc.start(t);
        osc.stop(t + 4.8);
      });
    }

    function setMuted(m) {
      muted = m;
      if (!ctx) return;
      master.gain.setTargetAtTime(m ? 0 : 0.32, ctx.currentTime, 0.25);
    }

    return { start, update, bell, setMuted, isStarted: () => started, isMuted: () => muted };
  })();

  // ============================================================
  //  DOM
  // ============================================================
  const numEl     = document.getElementById("num");
  const unitEl    = document.getElementById("unit");
  const lineA     = document.getElementById("lineA");
  const lineB     = document.getElementById("lineB");
  const sourceEl  = document.getElementById("source");
  const hintEl    = document.getElementById("hint");
  const endnoteEl = document.getElementById("endnote");
  const railEl    = document.getElementById("rail");
  const liveEl    = document.getElementById("live");
  const playBtn   = document.getElementById("playBtn");
  const nowBtn    = document.getElementById("nowBtn");
  const randomBtn = document.getElementById("randomBtn");
  const shareBtn  = document.getElementById("shareBtn");
  const muteBtn   = document.getElementById("muteBtn");

  // ============================================================
  //  State
  // ============================================================
  const state = {
    p: 0,
    years: 0,
    depth: 0,
    lastSky: null,
    lastNum: "Now",
    lastUnit: "",
    lastMilestone: -1,
    activeLine: lineA,
    started: false,
    playing: false,
    lastTick: 0,
    lastRenderedDepth: -1
  };

  // ============================================================
  //  Rail
  // ============================================================
  const railTicks = [];
  (() => {
    MILESTONES.forEach((m, i) => {
      if (m.y === 0) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rail-tick";
      btn.style.top = (yearsToScroll(m.y) * 100) + "%";
      const f = fmt(m.y);
      const label = `${f.n}${f.u ? " " + f.u : ""}`;
      btn.setAttribute("aria-label", `Jump to ${label}`);
      btn.title = `${label} — ${m.line}`;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        begin();
        window.scrollTo({ top: yearsToScroll(m.y) * maxScroll(), behavior: "smooth" });
      });
      railEl.appendChild(btn);
      railTicks.push({ el: btn, y: m.y, index: i });
    });

    const head = document.createElement("div");
    head.className = "rail-head";
    railEl.appendChild(head);
    railEl._head = head;
  })();

  (() => {
    let dragging = false;
    function setFromEvent(e) {
      const r = railEl.getBoundingClientRect();
      const y = Math.min(r.bottom, Math.max(r.top, e.clientY));
      const p = (y - r.top) / (r.height || 1);
      begin();
      window.scrollTo({ top: p * maxScroll(), behavior: "auto" });
    }
    railEl.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".rail-tick")) return;
      dragging = true;
      railEl.setPointerCapture(e.pointerId);
      setFromEvent(e);
      e.preventDefault();
    });
    railEl.addEventListener("pointermove", (e) => { if (dragging) setFromEvent(e); });
    const end = (e) => {
      dragging = false;
      try { railEl.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    railEl.addEventListener("pointerup", end);
    railEl.addEventListener("pointercancel", end);
  })();

  // ============================================================
  //  Milestone
  // ============================================================
  function setMilestone(index) {
    if (index === state.lastMilestone) return;
    state.lastMilestone = index;

    const next = state.activeLine === lineA ? lineB : lineA;
    const prev = state.activeLine;

    next.textContent = MILESTONES[index].line;
    void next.offsetWidth;

    next.classList.add("active");
    next.classList.remove("leaving");
    prev.classList.remove("active");
    prev.classList.add("leaving");

    next.setAttribute("aria-hidden", "false");
    prev.setAttribute("aria-hidden", "true");
    state.activeLine = next;

    const s = MILESTONES[index].source;
    if (s) { sourceEl.textContent = s; sourceEl.classList.add("visible"); }
    else   { sourceEl.classList.remove("visible"); }

    liveEl.textContent = MILESTONES[index].line;

    if (Sound.isStarted()) Sound.bell(depthOf(MILESTONES[index].y));
  }

  // ============================================================
  //  Bootstrap
  // ============================================================
  function begin() {
    if (state.started) return;
    state.started = true;
    Sound.start();
  }
  ["pointerdown", "keydown", "touchstart", "wheel"].forEach(ev => {
    window.addEventListener(ev, begin, { once: true, passive: true });
  });

  // ============================================================
  //  Render
  // ============================================================
  function render() {
    const years = state.years;
    state.depth = depthOf(years);

    const f = fmt(years);
    if (f.n !== state.lastNum) { numEl.textContent = f.n; state.lastNum = f.n; }
    if (f.u !== state.lastUnit) { unitEl.textContent = f.u; state.lastUnit = f.u; }

    let mi = 0;
    for (let i = 0; i < MILESTONES.length; i++) {
      if (MILESTONES[i].y <= years) mi = i; else break;
    }
    setMilestone(mi);

    const sky = Sky.skyColorAt(state.depth);
    const r = Math.round(sky[0]), g = Math.round(sky[1]), b = Math.round(sky[2]);
    if (!state.lastSky || state.lastSky[0] !== r || state.lastSky[1] !== g || state.lastSky[2] !== b) {
      state.lastSky = [r, g, b];
      document.body.style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    railEl._head.style.top = (state.p * 100) + "%";
    for (const t of railTicks) t.el.dataset.active = String(t.index === mi);

    hintEl.classList.toggle("hidden", state.p > 0.004);
    endnoteEl.classList.toggle("visible", state.p > 0.988);

    Sound.update(state.depth);
    scheduleHashWrite();
  }

  function onScroll() {
    const p = Math.min(1, Math.max(0, window.scrollY / maxScroll()));
    state.p = p;
    state.years = scrollToYears(p);
    render();
  }

  // ============================================================
  //  Hash
  // ============================================================
  let hashTimer = 0;
  let suppressHash = false;
  function scheduleHashWrite() {
    if (suppressHash) return;
    clearTimeout(hashTimer);
    hashTimer = setTimeout(() => {
      const y = state.years;
      const h = y < 1 ? "" : "#y=" + Math.round(y);
      if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    }, 350);
  }
  function readHash() {
    const m = /^#y=(\d+)$/.exec(location.hash);
    if (!m) return null;
    const y = parseInt(m[1], 10);
    if (!isFinite(y) || y < 1) return null;
    return Math.min(MAX_YEARS, y);
  }

  // ============================================================
  //  Autoplay
  // ============================================================
  const PLAY_RATE = 0.012;
  function setPlaying(on) {
    state.playing = on;
    playBtn.setAttribute("aria-pressed", String(on));
    playBtn.textContent = on ? "Pause" : "Play";
    playBtn.setAttribute("aria-label", on ? "Pause the journey" : "Play the journey");
    if (on) {
      begin();
      state.lastTick = performance.now();
      if (state.p >= 0.999) window.scrollTo({ top: 0, behavior: "auto" });
    }
  }
  playBtn.addEventListener("click", () => setPlaying(!state.playing));

  nowBtn.addEventListener("click", () => {
    begin(); setPlaying(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  randomBtn.addEventListener("click", () => {
    begin(); setPlaying(false);
    const p = HOLD + Math.random() * (1 - HOLD);
    window.scrollTo({ top: p * maxScroll(), behavior: "smooth" });
  });

  shareBtn.addEventListener("click", async () => {
    begin();
    const y = state.years;
    const h = y < 1 ? "" : "#y=" + Math.round(y);
    const url = location.origin + location.pathname + location.search + h;
    const f = fmt(y);
    const title = y < 1
      ? "The Deep Future Clock — right now"
      : `The Deep Future Clock — ${f.n}${f.u ? " " + f.u : ""} from now`;
    try {
      if (navigator.share) await navigator.share({ title, url });
      else if (navigator.clipboard) { await navigator.clipboard.writeText(url); flashButton(shareBtn, "Copied"); }
      else prompt("Copy this link:", url);
    } catch (_) {}
  });

  muteBtn.addEventListener("click", () => {
    begin();
    const next = !Sound.isMuted();
    Sound.setMuted(next);
    muteBtn.setAttribute("aria-pressed", String(next));
    muteBtn.textContent = next ? "Muted" : "Sound";
    muteBtn.setAttribute("aria-label", next ? "Unmute sound" : "Mute sound");
  });

  function flashButton(btn, text) {
    const original = btn.textContent;
    btn.textContent = text;
    btn.dataset.flash = "true";
    setTimeout(() => { btn.textContent = original; delete btn.dataset.flash; }, 1400);
  }

  // ============================================================
  //  Keyboard
  // ============================================================
  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;

    const max = maxScroll();
    const small = window.innerHeight * 0.6;
    const big = window.innerHeight * 2.4;

    switch (e.key) {
      case "ArrowDown": window.scrollBy(0, small); e.preventDefault(); break;
      case "ArrowUp":   window.scrollBy(0, -small); e.preventDefault(); break;
      case "PageDown":  window.scrollBy(0, big); e.preventDefault(); break;
      case "PageUp":    window.scrollBy(0, -big); e.preventDefault(); break;
      case "Home":      setPlaying(false); window.scrollTo({ top: 0, behavior: "smooth" }); e.preventDefault(); break;
      case "End":       setPlaying(false); window.scrollTo({ top: max, behavior: "smooth" }); e.preventDefault(); break;
      case " ":
        if (!e.shiftKey) { setPlaying(!state.playing); e.preventDefault(); }
        break;
      case "r": case "R": randomBtn.click(); break;
      case "s": case "S": shareBtn.click(); break;
      case "m": case "M": muteBtn.click(); break;
    }
  });

  // ============================================================
  //  Loop — only redraw when depth actually changes
  // ============================================================
  function loop(t) {
    if (state.playing) {
      const dt = Math.min(0.05, (t - state.lastTick) / 1000);
      state.lastTick = t;
      const max = maxScroll();
      const next = Math.min(max, window.scrollY + max * PLAY_RATE * dt);
      if (next >= max - 0.5) setPlaying(false);
      else window.scrollTo(0, next);
    } else {
      state.lastTick = t;
    }

    // Only repaint when depth changed — the scene itself never moves
    if (Math.abs(state.depth - state.lastRenderedDepth) > 0.00008) {
      Sky.draw(state.depth);
      state.lastRenderedDepth = state.depth;
    }

    requestAnimationFrame(loop);
  }

  // ============================================================
  //  Resize
  // ============================================================
  let resizeRaf = 0;
  function onResize() {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      Sky.resize();
      state.lastRenderedDepth = -1;
      Sky.draw(state.depth);
      onScroll();
    });
  }

  // ============================================================
  //  Init
  // ============================================================
  function init() {
    Sky.resize();
    Sky.draw(0);
    state.lastRenderedDepth = 0;

    const fromHash = readHash();
    if (fromHash) {
      suppressHash = true;
      window.scrollTo({ top: yearsToScroll(fromHash) * maxScroll(), behavior: "auto" });
      requestAnimationFrame(() => { onScroll(); suppressHash = false; });
    } else {
      onScroll();
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onResize, { passive: true });
  window.addEventListener("orientationchange", onResize, { passive: true });
  window.addEventListener("hashchange", () => {
    const y = readHash();
    if (y != null) {
      suppressHash = true;
      window.scrollTo({ top: yearsToScroll(y) * maxScroll(), behavior: "auto" });
      requestAnimationFrame(() => { suppressHash = false; });
    }
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
